name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Version in the code matches the tag
        run: |
          code=$(./burrowrs version | cut -d' ' -f2)
          [ "v$code" = "$GITHUB_REF_NAME" ] || { echo "burrowrs says $code, tag is $GITHUB_REF_NAME"; exit 1; }
          grep -q "^## \[$code\]" CHANGELOG.md || { echo "CHANGELOG.md has no [$code] section"; exit 1; }

      - name: Unit tests
        run: scripts/test.sh unit

      - name: Build the source archive and checksums
        run: |
          name="burrowrs-${GITHUB_REF_NAME}"
          mkdir dist
          git archive --format=tar.gz --prefix="$name/" -o "dist/$name.tar.gz" "$GITHUB_REF_NAME"
          (cd dist && sha256sum ./*.tar.gz > SHA256SUMS)
          # Release notes: this version's CHANGELOG section.
          awk -v v="${GITHUB_REF_NAME#v}" '
            $0 ~ "^## \\[" v "\\]" {on=1; next}
            on && /^## \[/ {exit}
            on {print}' CHANGELOG.md > dist/notes.md

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS --clobber
          else
            gh release create "$GITHUB_REF_NAME" --title "burrowrs $GITHUB_REF_NAME" \
              --notes-file dist/notes.md --verify-tag dist/*.tar.gz dist/SHA256SUMS
          fi
