# burrowrs: network tuning for a busy TCP relay. Installed by scripts/install-host.sh.

# BBR congestion control with the fq qdisc: better throughput and latency
# on lossy, long-distance paths (exactly what censored users have).
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# Bigger accept and SYN queues for bursts of new connections.
net.core.somaxconn = 8192
net.ipv4.tcp_max_syn_backlog = 8192
net.core.netdev_max_backlog = 16384

# Each client is one inbound plus one outbound connection, and Docker's NAT
# tracks both. (File limits and the ephemeral port range are set per
# container in compose.yaml; the kernel defaults are already generous.)
net.netfilter.nf_conntrack_max = 262144

# Socket buffers up to 16 MiB for high bandwidth-delay paths.
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_rmem = 4096 131072 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216

# Keep at most 128 KiB of not-yet-sent data per socket: less memory per
# connection and less queueing delay, with no loss of throughput under BBR.
net.ipv4.tcp_notsent_lowat = 131072

# The keys below (and somaxconn and tcp_max_syn_backlog above) are per network
# namespace: the proxy container gets its own copy in compose.yaml.

# Detect and recover from MTU black holes (common on mobile networks).
net.ipv4.tcp_mtu_probing = 1
# Release dead sockets faster; keep connections alive through NATs.
net.ipv4.tcp_fin_timeout = 15
net.ipv4.tcp_keepalive_time = 300
net.ipv4.tcp_keepalive_intvl = 30
net.ipv4.tcp_keepalive_probes = 5
# Don't drop to slow start after short idle periods (chatty clients).
net.ipv4.tcp_slow_start_after_idle = 0
