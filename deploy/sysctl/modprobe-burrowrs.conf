# burrowrs: one connection-tracking hash bucket per four entries
# (net.netfilter.nf_conntrack_max = 262144 in 99-burrowrs.conf). The kernel's
# default for a 1 GB server is 8192 buckets, so a full table would mean chains
# 32 entries long on every packet's lookup.
options nf_conntrack hashsize=65536
